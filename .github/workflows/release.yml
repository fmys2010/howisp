name: release

on:
  push:
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 静态检查
        run: go vet ./...

      # 带上 -race：隧道状态会被健康检查、HTTP 接口和重连 goroutine
      # 并发读写，竞态只有 race detector 能拦住。
      # netns 相关的用例在无权限时会自己跳过，runner 是普通用户也能跑。
      - name: 测试
        run: go test -race ./... -count=1

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: 编译
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: '0'
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION}" \
            -o fanout .

      - name: 打包
        run: |
          tar czf "fanout-linux-${{ matrix.goarch }}.tar.gz" \
            fanout install.sh f.sh fanout.service README.md

      - uses: actions/upload-artifact@v4
        with:
          name: fanout-linux-${{ matrix.goarch }}
          path: fanout-linux-${{ matrix.goarch }}.tar.gz

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: startsWith(github.ref, 'refs/tags/')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=ref,event=branch,enable=${{ !startsWith(github.ref, 'refs/tags/') }}

      # 打 tag 时构建并推送多架构镜像；PR / 手动触发只验证能不能构建出来
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: 生成校验和
        run: sha256sum fanout-linux-*.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            fanout-linux-*.tar.gz
            checksums.txt
          generate_release_notes: true